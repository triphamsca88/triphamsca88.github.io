<!doctype html>
<!-- Template for public/og-image.png (1200x630), rendered with a headless browser (see README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500&family=JetBrains+Mono:wght@500&family=Sora:wght@700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #081A2B; }
  .hero { position: absolute; inset: 0; background: url('../public/img/hero_supply_chain.svg') right center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,26,43,.97) 0%, rgba(8,26,43,.9) 40%, rgba(8,26,43,.35) 68%, rgba(8,26,43,0) 85%); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .eyebrow { font: 500 20px 'JetBrains Mono', monospace; letter-spacing: .16em; color: #2EC4B6; text-transform: uppercase; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ''; width: 40px; border-top: 3px dashed #2EC4B6; }
  h1 { margin: 0; font: 700 76px/1.05 'Sora', sans-serif; color: #fff; letter-spacing: -.01em; }
  .role { font: 700 30px 'Sora', sans-serif; color: #F4A259; }
  .sub { font: 500 24px 'Be Vietnam Pro', sans-serif; color: #A9C0D2; }
  .tag { margin-top: 10px; align-self: flex-start; font: 500 18px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #EAF4FB; border: 1.5px solid rgba(46,196,182,.6); padding: 10px 16px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="hero"></div>
  <div class="shade"></div>
  <div class="text">
    <span class="eyebrow">Portfolio</span>
    <h1>Pham Duc Tri</h1>
    <span class="role">Supply Chain Analyst Intern</span>
    <span class="sub">Logistics Technology student at UEH</span>
    <span class="tag">triphamsca88.github.io</span>
  </div>
</body>
</html>
