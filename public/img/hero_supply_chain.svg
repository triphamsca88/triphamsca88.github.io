<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Supply chain analyst hero</title>
  <desc id="d">An animated supply chain network from supplier to customer, with a barge on an inland waterway and two analytics cards for fleet performance and demand forecast.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="85%">
      <stop offset="0" stop-color="#143A5C"/>
      <stop offset="0.55" stop-color="#0D2740"/>
      <stop offset="1" stop-color="#081A2B"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#081A2B" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#081A2B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="1">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#2EC4B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#9FC9E8" opacity="0.13"/>
    </pattern>
    <style>
      .route{fill:none;stroke:#2EC4B6;stroke-width:2.2;stroke-opacity:.55;stroke-dasharray:6 10;animation:flow 2.6s linear infinite}
      .route.alt{stroke:#F4A259;stroke-opacity:.55}
      .node{fill:#11304D;stroke:#2EC4B6;stroke-width:2.2}
      .ico{fill:none;stroke:#EAF4FB;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
      .lbl{font:600 13px 'Segoe UI',Inter,Arial,sans-serif;letter-spacing:2.2px;fill:#BFD8EA}
      .card{fill:#0F2D49;fill-opacity:.94;stroke:#2EC4B6;stroke-opacity:.35;stroke-width:1.4}
      .ct{font:700 13px 'Segoe UI',Inter,Arial,sans-serif;letter-spacing:2.4px;fill:#EAF4FB}
      .cs{font:500 11px 'Segoe UI',Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#8FB3CE}
      .fc{fill:none;stroke:#F4A259;stroke-width:2.4;stroke-dasharray:7 6;animation:flow 1.8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes pulse{0%{r:26px;opacity:.55}100%{r:46px;opacity:0}}
      .ring{fill:none;stroke:#2EC4B6;stroke-width:1.6;animation:pulse 3s ease-out infinite}
      @media (prefers-reduced-motion: reduce){.route,.fc,.ring{animation:none}}
    </style>

    <path id="p1" d="M820,250 C930,250 1000,330 1080,420"/>
    <path id="p2" d="M820,250 C760,350 690,440 700,560"/>
    <path id="p3" d="M700,560 C760,660 860,700 960,690"/>
    <path id="p4" d="M960,690 C1010,600 1030,500 1080,420"/>
    <path id="p5" d="M1080,420 C1180,420 1260,450 1330,520"/>
    <path id="p6" d="M1330,520 C1420,480 1450,410 1470,330"/>
    <path id="p7" d="M960,690 C1100,700 1250,640 1330,520"/>
    <path id="bargePath" d="M360,905 C560,800 770,752 930,744"/>

    <g id="parcel">
      <circle r="6.5" fill="#F4A259"/>
      <circle r="11" fill="#F4A259" opacity=".22"/>
    </g>
    <g id="parcelT">
      <circle r="6" fill="#2EC4B6"/>
      <circle r="10.5" fill="#2EC4B6" opacity=".22"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- faint container yard, bottom left -->
  <g opacity=".09" fill="#9FC9E8">
    <rect x="40" y="760" width="120" height="44" rx="3"/><rect x="164" y="760" width="120" height="44" rx="3"/>
    <rect x="40" y="808" width="120" height="44" rx="3"/><rect x="164" y="808" width="120" height="44" rx="3"/>
    <rect x="288" y="808" width="120" height="44" rx="3"/><rect x="100" y="712" width="120" height="44" rx="3"/>
    <rect x="40" y="856" width="120" height="44" rx="3"/><rect x="164" y="856" width="120" height="44" rx="3"/>
    <rect x="288" y="856" width="120" height="44" rx="3"/>
  </g>
  <!-- gantry crane silhouette -->
  <g opacity=".1" stroke="#9FC9E8" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M470,900 V600 M560,900 V600 M440,600 H640 M600,600 V680"/>
  </g>

  <!-- inland waterway -->
  <path d="M330,920 C560,800 770,756 960,744 S1360,770 1610,700" fill="none" stroke="url(#river)" stroke-width="78" stroke-linecap="round"/>
  <path d="M330,920 C560,800 770,756 960,744 S1360,770 1610,700" fill="none" stroke="#2EC4B6" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 12"/>

  <!-- barge with containers -->
  <g>
    <g transform="scale(1.15)">
      <polygon points="-48,0 48,0 40,13 -40,13" fill="#1F4A6E" stroke="#BFD8EA" stroke-width="1.4"/>
      <rect x="-40" y="-14" width="22" height="13" rx="1.5" fill="#F4A259"/>
      <rect x="-16" y="-14" width="22" height="13" rx="1.5" fill="#2EC4B6"/>
      <rect x="8" y="-14" width="22" height="13" rx="1.5" fill="#EAD9B8"/>
      <rect x="-28" y="-27" width="22" height="12" rx="1.5" fill="#E76F51"/>
      <rect x="-4" y="-27" width="22" height="12" rx="1.5" fill="#F4A259"/>
      <rect x="33" y="-12" width="9" height="11" rx="1" fill="#BFD8EA"/>
    </g>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#bargePath" xlink:href="#bargePath"/>
    </animateMotion>
  </g>

  <!-- routes -->
  <use href="#p1" xlink:href="#p1" class="route"/>
  <use href="#p2" xlink:href="#p2" class="route alt"/>
  <use href="#p3" xlink:href="#p3" class="route alt"/>
  <use href="#p4" xlink:href="#p4" class="route"/>
  <use href="#p5" xlink:href="#p5" class="route"/>
  <use href="#p6" xlink:href="#p6" class="route alt"/>
  <use href="#p7" xlink:href="#p7" class="route"/>

  <!-- moving parcels -->
  <use href="#parcelT" xlink:href="#parcelT"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#p1" xlink:href="#p1"/></animateMotion></use>
  <use href="#parcel" xlink:href="#parcel"><animateMotion dur="4.8s" repeatCount="indefinite" begin="-1s"><mpath href="#p2" xlink:href="#p2"/></animateMotion></use>
  <use href="#parcel" xlink:href="#parcel"><animateMotion dur="3.6s" repeatCount="indefinite" begin="-2s"><mpath href="#p3" xlink:href="#p3"/></animateMotion></use>
  <use href="#parcelT" xlink:href="#parcelT"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.5s"><mpath href="#p4" xlink:href="#p4"/></animateMotion></use>
  <use href="#parcelT" xlink:href="#parcelT"><animateMotion dur="3.4s" repeatCount="indefinite" begin="-1.5s"><mpath href="#p5" xlink:href="#p5"/></animateMotion></use>
  <use href="#parcel" xlink:href="#parcel"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.8s"><mpath href="#p6" xlink:href="#p6"/></animateMotion></use>
  <use href="#parcelT" xlink:href="#parcelT"><animateMotion dur="5s" repeatCount="indefinite" begin="-2.4s"><mpath href="#p7" xlink:href="#p7"/></animateMotion></use>

  <!-- nodes -->
  <!-- supplier -->
  <g transform="translate(820,250)">
    <circle class="ring" r="26"/>
    <circle class="node" r="26"/>
    <rect class="ico" x="-11" y="-9" width="22" height="18" rx="1.5"/>
    <path class="ico" d="M-11,-9 L11,9 M11,-9 L-11,9"/>
    <text class="lbl" y="52" text-anchor="middle">SUPPLIER</text>
  </g>
  <!-- factory -->
  <g transform="translate(700,560)">
    <circle class="ring" r="26" style="animation-delay:.6s"/>
    <circle class="node" r="26"/>
    <path class="ico" d="M-13,10 V-1 L-7,-6 V-1 L-1,-6 V-1 L5,-6 V-1 L13,-1 V10 Z M7,-1 V-12 H11 V-1"/>
    <text class="lbl" y="52" text-anchor="middle">FACTORY</text>
  </g>
  <!-- port / ICD -->
  <g transform="translate(960,690)">
    <circle class="ring" r="26" style="animation-delay:1.2s"/>
    <circle class="node" r="26" style="stroke:#F4A259"/>
    <path class="ico" d="M-14,3 H14 L9,10 H-9 Z"/>
    <rect class="ico" x="-9" y="-6" width="6" height="8"/>
    <rect class="ico" x="-2" y="-6" width="6" height="8"/>
    <rect class="ico" x="5" y="-3" width="5" height="5"/>
    <text class="lbl" y="-40" text-anchor="middle">PORT · ICD</text>
  </g>
  <!-- warehouse -->
  <g transform="translate(1080,420)">
    <circle class="ring" r="26" style="animation-delay:1.8s"/>
    <circle class="node" r="26"/>
    <path class="ico" d="M-13,10 V-3 L0,-11 L13,-3 V10 Z"/>
    <rect class="ico" x="-6" y="1" width="12" height="9"/>
    <path class="ico" d="M-6,4 H6 M-6,7 H6"/>
    <text class="lbl" y="52" text-anchor="middle">WAREHOUSE</text>
  </g>
  <!-- distribution centre -->
  <g transform="translate(1330,520)">
    <circle class="ring" r="26" style="animation-delay:2.4s"/>
    <circle class="node" r="26"/>
    <rect class="ico" x="-11" y="0" width="10" height="10"/>
    <rect class="ico" x="1" y="0" width="10" height="10"/>
    <rect class="ico" x="-5" y="-11" width="10" height="10"/>
    <text class="lbl" y="52" text-anchor="middle">DISTRIBUTION</text>
  </g>
  <!-- customer -->
  <g transform="translate(1470,330)">
    <circle class="ring" r="26" style="animation-delay:.3s"/>
    <circle class="node" r="26" style="stroke:#F4A259"/>
    <path class="ico" d="M0,12 C-7,4 -10,-1 -10,-4 A10,10 0 1 1 10,-4 C10,-1 7,4 0,12 Z"/>
    <circle class="ico" cy="-4" r="3"/>
    <text class="lbl" y="52" text-anchor="middle">CUSTOMER</text>
  </g>

  <!-- card: fleet performance -->
  <g transform="translate(1110,70)">
    <rect class="card" width="400" height="200" rx="16"/>
    <text class="ct" x="22" y="34">FLEET PERFORMANCE</text>
    <circle cx="372" cy="29" r="5" fill="#2EC4B6"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <!-- three KPI meters -->
    <g transform="translate(22,56)">
      <text class="cs" y="10">ON TIME</text>
      <rect y="18" width="100" height="6" rx="3" fill="#1D4466"/>
      <rect y="18" width="86" height="6" rx="3" fill="#2EC4B6"><animate attributeName="width" values="70;88;80;86" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(150,56)">
      <text class="cs" y="10">TURNAROUND</text>
      <rect y="18" width="100" height="6" rx="3" fill="#1D4466"/>
      <rect y="18" width="62" height="6" rx="3" fill="#F4A259"><animate attributeName="width" values="72;58;66;62" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(278,56)">
      <text class="cs" y="10">UTILISATION</text>
      <rect y="18" width="100" height="6" rx="3" fill="#1D4466"/>
      <rect y="18" width="78" height="6" rx="3" fill="#EAD9B8"><animate attributeName="width" values="64;80;74;78" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <!-- bar chart -->
    <g transform="translate(22,180)" fill="#2EC4B6">
      <line x1="0" y1="0" x2="356" y2="0" stroke="#3A6386" stroke-width="1"/>
      <rect x="6" y="-48" width="26" height="48" rx="3"><animate attributeName="height" values="48;60;48" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="-48;-60;-48" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="50" y="-66" width="26" height="66" rx="3"/>
      <rect x="94" y="-40" width="26" height="40" rx="3" fill="#F4A259"><animate attributeName="height" values="40;54;40" dur="4.6s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-54;-40" dur="4.6s" repeatCount="indefinite"/></rect>
      <rect x="138" y="-72" width="26" height="72" rx="3"/>
      <rect x="182" y="-58" width="26" height="58" rx="3"><animate attributeName="height" values="58;46;58" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="-58;-46;-58" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="226" y="-80" width="26" height="80" rx="3"/>
      <rect x="270" y="-62" width="26" height="62" rx="3" fill="#F4A259"/>
      <rect x="314" y="-86" width="26" height="86" rx="3"><animate attributeName="height" values="86;74;86" dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="-86;-74;-86" dur="3.6s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- card: demand forecast -->
  <g transform="translate(1180,632)">
    <rect class="card" width="330" height="178" rx="16"/>
    <text class="ct" x="22" y="34">DEMAND FORECAST</text>
    <g transform="translate(22,148)">
      <line x1="0" y1="0" x2="286" y2="0" stroke="#3A6386" stroke-width="1"/>
      <line x1="170" y1="-92" x2="170" y2="0" stroke="#3A6386" stroke-width="1" stroke-dasharray="3 4"/>
      <polygon points="170,-62 200,-74 230,-60 260,-84 286,-80 286,-42 260,-46 230,-26 200,-40 170,-44" fill="#2EC4B6" opacity=".16"/>
      <polyline points="0,-30 28,-46 56,-38 84,-60 112,-50 140,-70 170,-54" fill="none" stroke="#EAD9B8" stroke-width="2.4" stroke-linejoin="round"/>
      <polyline class="fc" points="170,-54 200,-58 230,-44 260,-66 286,-62"/>
      <circle cx="170" cy="-54" r="4.5" fill="#EAD9B8"/>
      <text class="cs" x="0" y="20">ACTUAL</text>
      <text class="cs" x="180" y="20">FORECAST</text>
    </g>
  </g>

  <!-- soft fade on the left so overlay text stays readable -->
  <rect width="1600" height="900" fill="url(#fadeLeft)"/>
</svg>
